name: NIFTY 4-Leg Calendar Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First calendar date to download"
        required: true
        default: "2021-01-01"
      end:
        description: "Last calendar date to download"
        required: true
        default: "2026-09-22"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests yfinance pytest

      - name: Restore acquisition cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nifty-calendar-\${{ github.event.inputs.start }}-\${{ github.event.inputs.end }}
          restore-keys: |
            nifty-calendar-

      - name: Unit tests
        run: pytest -q

      - name: Download NSE NIFTY options
        run: |
          python scripts/download_nse_daily.py \
            --start "\${{ github.event.inputs.start }}" \
            --end "\${{ github.event.inputs.end }}" \
            --out data/cache/nifty_fo_daily.parquet \
            --manifest data/manifests/nse_derivatives_manifest.csv

      - name: Download NIFTY spot
        run: |
          python scripts/download_nifty_spot.py \
            --start "\${{ github.event.inputs.start }}" \
            --end "\${{ github.event.inputs.end }}" \
            --out data/cache/nifty_spot_daily.csv

      - name: Run frozen strategy
        run: |
          python src/nifty_calendar/backtest.py \
            --fo data/cache/nifty_fo_daily.parquet \
            --spot data/cache/nifty_spot_daily.csv \
            --out reports/nifty_calendar/trade_level_results.csv

      - name: Build summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          p = Path("reports/nifty_calendar/trade_level_results.csv")
          df = pd.read_csv(p)
          if df.empty:
              raise SystemExit("No valid trades produced; inspect data manifest before interpreting the run.")
          df["cum_pnl_inr"] = df["pnl_inr"].cumsum()
          peak = df["cum_pnl_inr"].cummax()
          drawdown = df["cum_pnl_inr"] - peak

          summary = [
              "# NIFTY 4-Leg Calendar — Backtest Summary",
              "",
              f"- Trades: {len(df)}",
              f"- Total P&L (points): {df['pnl_points'].sum():.4f}",
              f"- Total P&L (INR): {df['pnl_inr'].sum():.2f}",
              f"- Mean trade (INR): {df['pnl_inr'].mean():.2f}",
              f"- Median trade (INR): {df['pnl_inr'].median():.2f}",
              f"- Win rate: {(df['pnl_inr'] > 0).mean():.2%}",
              f"- Max drawdown (INR): {drawdown.min():.2f}",
              "",
              "This is gross mark-to-market P&L from daily OPEN/CLOSE fields acquired by the workflow.",
              "Brokerage, statutory charges and slippage are not yet subtracted in this summary.",
          ]
          out = Path("reports/nifty_calendar/BACKTEST_SUMMARY.md")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\\n".join(summary), encoding="utf-8")
          PY

      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nifty_calendar/PHASE_STATUS.md docs/nifty_calendar/ERROR_LOG.md docs/nifty_calendar/CONVERSATION_LOG.md reports/nifty_calendar data/manifests
          git diff --cached --quiet || git commit -m "Record NIFTY calendar backtest outputs"
          git push

      - name: Upload normalized data artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-calendar-normalized-data
          path: |
            data/cache/nifty_fo_daily.parquet
            data/cache/nifty_spot_daily.csv
            data/manifests/nse_derivatives_manifest.csv
            reports/nifty_calendar/trade_level_results.csv
            reports/nifty_calendar/BACKTEST_SUMMARY.md
