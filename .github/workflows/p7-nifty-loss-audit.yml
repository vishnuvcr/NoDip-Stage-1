name: P7 NIFTY Loss Audit and Entry Tuning

on:
  workflow_dispatch:
  push:
    branches: [research-nifty-4leg-calendar-p7-loss-audit]
    paths:
      - ".github/workflows/p7-nifty-loss-audit.yml"
      - "scripts/audit_losing_trades.py"
      - "docs/nifty_calendar/P7_LOSS_AUDIT_PLAN.md"
      - "docs/nifty_calendar/P7_ENTRY_CRITERIA_LOCK.md"

concurrency:
  group: nifty-calendar-p7-loss-audit
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  loss-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P7 branch
        uses: actions/checkout@v4
        with:
          ref: research-nifty-4leg-calendar-p7-loss-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy tabulate pytest requests

      - name: Rebuild canonical strict ledger from P5 reconciliation
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_strict_p6_inputs.py             --recon reports/nifty_calendar/P5_SECONDARY_RECONCILIATION_2022_2024.csv             --secondary-ledger reports/nifty_calendar/SECONDARY_TRADE_LEVEL_RESULTS_2022_2024.csv             --out-ledger reports/nifty_calendar/STRICT_TRADE_LEVEL_RESULTS_2022_2024.csv             --out-costs reports/nifty_calendar/STRICT_COST_SENSITIVITY_2022_2024.csv

      - name: Run repository tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run P7 losing-trade audit
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_losing_trades.py \
            --ledger reports/nifty_calendar/STRICT_TRADE_LEVEL_RESULTS_2022_2024.csv \
            --recon reports/nifty_calendar/P5_SECONDARY_RECONCILIATION_2022_2024.csv \
            --out-loss-audit reports/nifty_calendar/LOSS_AUDIT_2022_2024.csv \
            --out-top-losses reports/nifty_calendar/LOSS_TOP_TRADES_2022_2024.csv \
            --out-grid reports/nifty_calendar/ENTRY_FILTER_GRID_2022_2024.csv \
            --out-report reports/nifty_calendar/ENTRY_TUNING_REPORT_2022_2024.md \
            --out-candidate reports/nifty_calendar/ENTRY_CRITERIA_CANDIDATE_2022_2024.md

      - name: Update P7 phase status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/nifty_calendar/PHASE_STATUS.md")
          s = p.read_text(encoding="utf-8")
          if "| P7 Loss audit / entry tuning |" not in s:
              s += "\n\n| P7 Loss audit / entry tuning | COMPLETE | Audited all 32 losing trades; identified front-leg loss concentration and locked candidate balance-ratio gate <= 1.20 for future post-2024 validation |"
          s = s.replace(
              "Last updated: 2026-09-23  — P0-P6 complete for 2022-2024 study",
              "Last updated: 2026-09-23  — P0-P7 complete for 2022-2024 study; P7 candidate gate reserved for post-2024 validation"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit P7 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/nifty_calendar/STRICT_TRADE_LEVEL_RESULTS_2022_2024.csv \
            reports/nifty_calendar/LOSS_AUDIT_2022_2024.csv \
            reports/nifty_calendar/LOSS_TOP_TRADES_2022_2024.csv \
            reports/nifty_calendar/ENTRY_FILTER_GRID_2022_2024.csv \
            reports/nifty_calendar/ENTRY_TUNING_REPORT_2022_2024.md \
            reports/nifty_calendar/ENTRY_CRITERIA_CANDIDATE_2022_2024.md \
            docs/nifty_calendar/PHASE_STATUS.md
          git diff --cached --quiet || git commit -m "Complete P7 losing-trade audit and candidate entry gate"
          git fetch origin research-nifty-4leg-calendar-p7-loss-audit
          git rebase origin/research-nifty-4leg-calendar-p7-loss-audit
          git push origin HEAD:research-nifty-4leg-calendar-p7-loss-audit

      - name: Upload P7 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-calendar-p7-loss-audit-2022-2024
          path: |
            reports/nifty_calendar/STRICT_TRADE_LEVEL_RESULTS_2022_2024.csv
            reports/nifty_calendar/LOSS_AUDIT_2022_2024.csv
            reports/nifty_calendar/LOSS_TOP_TRADES_2022_2024.csv
            reports/nifty_calendar/ENTRY_FILTER_GRID_2022_2024.csv
            reports/nifty_calendar/ENTRY_TUNING_REPORT_2022_2024.md
            reports/nifty_calendar/ENTRY_CRITERIA_CANDIDATE_2022_2024.md
