name: P9 Rissin secondary OOS validation

on:
  push:
    paths:
      - 'scripts/p9_rissin_oos_compare.py'
      - '.github/workflows/p9-rissin-oos-validation.yml'
  workflow_dispatch:

concurrency:
  group: p9-rissin-oos
  cancel-in-progress: true

jobs:
  rissin-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy duckdb huggingface_hub
      - name: Restore primary NIFTY index cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1
      - name: Run Rissin secondary OOS comparison
        run: python scripts/p9_rissin_oos_compare.py
      - name: Commit Rissin results conflict-safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             reports/nifty_calendar/P9_RISSIN_OOS_COMPARISON.csv             reports/nifty_calendar/P9_RISSIN_OOS_COSTS.csv             reports/nifty_calendar/P9_RISSIN_OOS_REPORT.md
          git diff --cached --quiet || git commit -m 'Run P9 Rissin secondary OOS comparison'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push
