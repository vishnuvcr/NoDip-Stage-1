name: P9 source timestamp alignment audit

on:
  push:
    paths:
      - 'scripts/p9_source_alignment_audit.py'
      - '.github/workflows/p9-source-alignment-audit.yml'
  workflow_dispatch:

concurrency:
  group: p9-source-alignment-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas pyarrow duckdb huggingface_hub
      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1
      - name: Fetch OOS source files if needed
        run: python scripts/p9_fetch_hf_oos.py
      - name: Run source alignment audit
        run: python scripts/p9_source_alignment_audit.py
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nifty_calendar/P9_SOURCE_ALIGNMENT_AUDIT.md reports/nifty_calendar/P9_HF_OOS_FETCH_MANIFEST.csv reports/nifty_calendar/P9_HF_OOS_FETCH_REPORT.md
          git diff --cached --quiet || git commit -m 'Audit P9 source timestamps and ATM alignment'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push
