name: P9 OOS DuckDB fixed-vs-event comparison

on:
  push:
    paths:
      - 'scripts/p9_oos_duckdb_compare.py'
      - '.github/workflows/p9-oos-duckdb-validation.yml'
  workflow_dispatch:

concurrency:
  group: p9-oos-duckdb
  cancel-in-progress: true

jobs:
  duckdb-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub numpy duckdb
      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1
      - name: Fetch OOS source files
        run: python scripts/p9_fetch_hf_oos.py
      - name: Save HF cache before analysis
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1
      - name: Run DuckDB OOS comparison
        run: python scripts/p9_oos_duckdb_compare.py
      - name: Commit DuckDB results conflict-safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             reports/nifty_calendar/P9_OOS_DUCKDB_COMPARISON.csv             reports/nifty_calendar/P9_OOS_DUCKDB_COSTS.csv             reports/nifty_calendar/P9_OOS_DUCKDB_REPORT.md             reports/nifty_calendar/P9_HF_OOS_FETCH_MANIFEST.csv             reports/nifty_calendar/P9_HF_OOS_FETCH_REPORT.md
          git diff --cached --quiet || git commit -m 'Run P9 OOS DuckDB fixed-vs-event comparison'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push
