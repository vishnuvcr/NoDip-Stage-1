name: P9 OOS intraday comparison

on:
  push:
    paths:
      - 'scripts/p9_oos_intraday_compare.py'
      - '.github/workflows/p9-oos-intraday-validation.yml'
  workflow_dispatch:

concurrency:
  group: p9-oos-intraday-validation
  cancel-in-progress: true

jobs:
  oos-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub numpy

      - name: Restore Hugging Face raw-file cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1

      - name: Ensure required primary-source files exist
        run: python scripts/p9_fetch_hf_intraday.py

      - name: Run OOS paired intraday comparison
        run: python scripts/p9_oos_intraday_compare.py

      - name: Commit OOS comparison
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             reports/nifty_calendar/P9_OOS_EVENT_TIMING_COMPARISON.csv             reports/nifty_calendar/P9_OOS_EVENT_TIMING_COSTS.csv             reports/nifty_calendar/P9_OOS_EVENT_TIMING_REPORT.md             reports/nifty_calendar/P9_HF_FETCH_MANIFEST.csv             reports/nifty_calendar/P9_HF_FETCH_REPORT.md             data/cache/p9_hf_probe/P9_CYCLE_MANIFEST.csv
          git diff --cached --quiet || git commit -m 'Run P9 OOS intraday timing comparison'
          git push
