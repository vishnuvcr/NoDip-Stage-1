name: P9 OOS fast fixed-vs-event comparison

on:
  push:
    paths:
      - 'scripts/p9_oos_fast_compare.py'
      - '.github/workflows/p9-oos-fast-validation.yml'
  workflow_dispatch:

concurrency:
  group: p9-oos-fast-validation
  cancel-in-progress: true

jobs:
  fast-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub numpy

      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface/hub/datasets--thetrademarkk--india-index-options-1m
          key: p9-hf-thetrademarkk-${{ runner.os }}-v1

      - name: Fetch OOS source files if needed
        run: python scripts/p9_fetch_hf_oos.py

      - name: Run lean OOS comparison
        run: python scripts/p9_oos_fast_compare.py

      - name: Commit lean OOS results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             reports/nifty_calendar/P9_OOS_FAST_COMPARISON.csv             reports/nifty_calendar/P9_OOS_FAST_COSTS.csv             reports/nifty_calendar/P9_OOS_FAST_REPORT.md             reports/nifty_calendar/P9_HF_OOS_FETCH_MANIFEST.csv             reports/nifty_calendar/P9_HF_OOS_FETCH_REPORT.md             data/cache/p9_hf_probe_oos
          git diff --cached --quiet || git commit -m 'Run lean P9 OOS fixed-vs-event comparison'
          git push
