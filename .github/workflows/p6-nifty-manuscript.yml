name: P6 NIFTY Calendar Final Manuscript

on:
  workflow_dispatch:

concurrency:
  group: nifty-calendar-p6-manuscript
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P6 manuscript branch
        uses: actions/checkout@v4
        with:
          ref: research-nifty-4leg-calendar-p6-manuscript
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib pytest requests

      - name: Run repository tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build final P6 manuscript and figures
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_p6_manuscript.py             --trade-level reports/nifty_calendar/SECONDARY_TRADE_LEVEL_RESULTS_2022_2024.csv             --recon reports/nifty_calendar/P5_SECONDARY_RECONCILIATION_2022_2024.csv             --costs reports/nifty_calendar/SECONDARY_COST_SENSITIVITY_2022_2024.csv             --out-report reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md             --out-stats reports/nifty_calendar/FINAL_SECONDARY_STATISTICS_2022_2024.csv             --fig-dir reports/nifty_calendar/figures

      - name: Recompute and verify statistics
        run: |
          python scripts/compute_secondary_statistics.py             --ledger reports/nifty_calendar/SECONDARY_TRADE_LEVEL_RESULTS_2022_2024.csv             --costs reports/nifty_calendar/SECONDARY_COST_SENSITIVITY_2022_2024.csv             --out-report /tmp/final_stats.md             --out-annual /tmp/final_annual.csv
          grep -q "Complete independent-secondary cycles: 132" /tmp/final_stats.md
          grep -q "Gross P&L: ₹188,237.50" /tmp/final_stats.md
          grep -q "Profit factor: 1.889" /tmp/final_stats.md

      - name: Validate manuscript assets
        run: |
          test -s reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md
          test -s reports/nifty_calendar/FINAL_SECONDARY_STATISTICS_2022_2024.csv
          test -s reports/nifty_calendar/figures/cumulative_pnl.svg
          test -s reports/nifty_calendar/figures/drawdown.svg
          test -s reports/nifty_calendar/figures/annual_pnl.svg
          test -s reports/nifty_calendar/figures/cost_sensitivity.svg
          grep -q "132 / 134" reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md
          grep -q "Rs 188,237.50" reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md
          grep -q "Research status: P0-P6 complete" reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md

      - name: Update final phase status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/nifty_calendar/PHASE_STATUS.md")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "| P6 Final manuscript | IN PROGRESS | Awaiting P5 independent-source reconciliation and final figures/tables |",
              "| P6 Final manuscript | COMPLETE | Corrected independent secondary 132-cycle manuscript, figures, statistics, appendices and validation checks committed |"
          )
          s = s.replace(
              "Last updated: 2026-09-23  — P5 complete; P6 manuscript in progress",
              "Last updated: 2026-09-23  — P0-P6 complete for 2022-2024 study"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit manuscript package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md             reports/nifty_calendar/FINAL_SECONDARY_STATISTICS_2022_2024.csv             reports/nifty_calendar/figures             docs/nifty_calendar/PHASE_STATUS.md
          git diff --cached --quiet || git commit -m "Finalize corrected NIFTY calendar P6 manuscript"
          git fetch origin research-nifty-4leg-calendar-p6-manuscript
          git rebase origin/research-nifty-4leg-calendar-p6-manuscript
          git push origin HEAD:research-nifty-4leg-calendar-p6-manuscript

      - name: Upload final manuscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty-calendar-p6-final-manuscript-2022-2024
          path: |
            reports/nifty_calendar/MANUSCRIPT_NIFTY_4LEG_CALENDAR_2022_2024.md
            reports/nifty_calendar/FINAL_SECONDARY_STATISTICS_2022_2024.csv
            reports/nifty_calendar/figures/*.svg
            reports/nifty_calendar/SECONDARY_TRADE_LEVEL_RESULTS_2022_2024.csv
            reports/nifty_calendar/SECONDARY_COST_SENSITIVITY_2022_2024.csv
