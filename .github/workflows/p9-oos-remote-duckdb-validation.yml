name: P9 OOS remote DuckDB comparison

on:
  push:
    paths:
      - 'scripts/p9_oos_remote_duckdb_compare.py'
      - '.github/workflows/p9-oos-remote-duckdb-validation.yml'
  workflow_dispatch:

concurrency:
  group: p9-oos-remote-duckdb
  cancel-in-progress: true

jobs:
  remote-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy duckdb
      - name: Run remote-predicate OOS comparison
        run: python scripts/p9_oos_remote_duckdb_compare.py
      - name: Commit remote comparison
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             reports/nifty_calendar/P9_OOS_DUCKDB_COMPARISON.csv             reports/nifty_calendar/P9_OOS_DUCKDB_COSTS.csv             reports/nifty_calendar/P9_OOS_DUCKDB_REPORT.md
          git diff --cached --quiet || git commit -m 'Run P9 OOS remote DuckDB comparison'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push
