name: P9 Rissin alignment sample

on:
  push:
    paths:
      - 'scripts/p9_rissin_alignment_sample.py'
      - '.github/workflows/p9-rissin-alignment-sample.yml'
  workflow_dispatch:

concurrency:
  group: p9-rissin-alignment-sample
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas pyarrow duckdb
      - run: python scripts/p9_rissin_alignment_sample.py
      - name: Commit sample
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nifty_calendar/P9_RISSIN_ALIGNMENT_SAMPLE.csv
          git diff --cached --quiet || git commit -m 'Add Rissin far-expiry coverage sample audit'
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push
