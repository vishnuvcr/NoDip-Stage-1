name: P9 alternate intraday data acquisition

on:
  push:
    paths:
      - 'scripts/p9_fetch_hf_intraday.py'
      - '.github/workflows/p9-data-acquisition.yml'
      - 'docs/nifty_calendar/P9_ALTERNATE_DATA_SOURCE_AUDIT.md'
  workflow_dispatch:

concurrency:
  group: p9-data-acquisition
  cancel-in-progress: true

jobs:
  fetch-hf-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data tools
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub

      - name: Fetch and verify required Hugging Face files
        run: python scripts/p9_fetch_hf_intraday.py

      - name: Cache fetched source files
        uses: actions/cache/save@v4
        with:
          path: data/cache/p9_hf_probe
          key: p9-hf-${{ runner.os }}-${{ github.sha }}

      - name: Commit manifest and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nifty_calendar/P9_HF_FETCH_MANIFEST.csv reports/nifty_calendar/P9_HF_FETCH_REPORT.md data/cache/p9_hf_probe/P9_CYCLE_MANIFEST.csv
          git diff --cached --quiet || git commit -m 'Record P9 alternate HF data acquisition manifest'
          git push