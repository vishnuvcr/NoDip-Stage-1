name: P10 NIFTY entry-day offset research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p10-entry-day-offsets.yml'
      - 'scripts/p10_entry_day_offsets.py'
      - 'docs/nifty_calendar/P10_ENTRY_DAY_OFFSET_PLAN.md'
      - 'docs/nifty_calendar/P10_TRIGGER.md'

concurrency:
  group: p10-entry-day-offsets-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  offsets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout P10 branch
        uses: actions/checkout@v4
        with:
          ref: research-nifty-4leg-calendar-p10-entry-day-offsets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Restore cached Rissin historical Parquet
        uses: actions/cache@v4
        with:
          path: data/cache/p10_rissin_hf
          key: p10-rissin-historical-daily-v1
          restore-keys: |
            p10-rissin-historical-daily-

      - name: Run P10 seven-offset study
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub pyarrow
          python scripts/p10_entry_day_offsets.py \
            --cache-dir data/cache/p10_rissin_hf \
            --dev-cycles reports/nifty_calendar/CYCLE_AUDIT_2022_2024.csv \
            --oos-cycles reports/nifty_calendar/P8_CYCLES_2025_ONWARD.csv \
            --out-ledger reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_LEDGER.csv \
            --out-summary reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_SUMMARY.csv \
            --out-paired reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_PAIRED.csv \
            --out-report reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_REPORT.md

      - name: Commit P10 results conflict-safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin research-nifty-4leg-calendar-p10-entry-day-offsets
          git reset --hard origin/research-nifty-4leg-calendar-p10-entry-day-offsets
          git add reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_LEDGER.csv reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_SUMMARY.csv reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_PAIRED.csv reports/nifty_calendar/P10_ENTRY_DAY_OFFSET_REPORT.md
          git diff --cached --quiet || git commit -m 'Complete P10 entry-day offset research'
          git push origin HEAD:research-nifty-4leg-calendar-p10-entry-day-offsets

      - name: Log workflow failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/nifty_calendar/ERROR_LOG.md')
          with p.open('a',encoding='utf-8') as f:
              f.write('\n## 2026-09-23 — P10 entry-day offset workflow failure\n')
              f.write('Run ID: '+os.getenv('GITHUB_RUN_ID','unknown')+'\n')
              f.write('Step failure requires inspection before any numerical interpretation.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/nifty_calendar/ERROR_LOG.md
          git diff --cached --quiet || git commit -m 'Log P10 entry-day offset workflow failure'
          git push origin HEAD:research-nifty-4leg-calendar-p10-entry-day-offsets
